description = "Self-declared directory listing flags (owner ask 2026-09-02). ALTER TABLE ADD reimburses boolean, contact text on x402_listings and both projections (x402_listings_by_recency 090, x402_listings_by_tag 096) -- nullable, no primary key involved, safe in place. reimburses is a listing owner's own unverified claim that they refund a payer on failed delivery -- not checked against anything for third-party listings, exactly as trustworthy as the owner is. contact is a bounded free-text point of contact (MAX_CONTACT_LENGTH in listing_service.py), not shape-validated beyond length. Both are set only at list/relist time (POST /api/v1/x402/list) -- renew() deliberately changes nothing about a listing but its term (see 099's own migration note), so these follow that existing precedent rather than becoming the first renew-editable fields; updating either requires relisting under the same owner wallet, which the existing ownership rule (094) already allows. A pre-104 row (or any listing that omits either field) reads back as unset -- reimburses False, contact empty -- never a fabricated claim either way. See app/modules/x402_directory/services/listing_service.py and api/routes.py."
