description = "Refund tracking on the x402 settlement ledger (090/095) -- owner requirement 2026-09-02: 'not a 500, not a 400 -- a 200 or your money back' for our own endpoints. ALTER TABLE ADD refund_tx_id text, refund_status text on both x402_settlements and x402_settlements_by_tx -- nullable, no primary key involved, safe in place. Written by modules/x402/paid_request.run_with_refund (new): a route opts in by wrapping its product-write step in this helper; on any exception raised after payment already settled, it sends the FULL settled amount back to the payer from a new dedicated x402_refund_mnemonic wallet (modules/x402/refund.py's send_refund, modeled directly on kya/services/payout_service.py's send_payout -- same never-raises/best-effort contract, same same-asset-back rule), records refund_status ('sent'|'failed'|'skipped') and refund_tx_id via the same read-then-update-on-known-key shape mark_fulfilled already uses (settlement.py's new record_refund), and returns an honest response instead of a bare 500. Paired with a new per-resource circuit breaker (modules/x402/circuit_breaker.py, Redis-backed, x402_refund_breaker_max_failures/window_seconds settings) that trips a resource off BEFORE the payment gate once it crosses too many refund-triggering failures in the window -- unlike this codebase's usual fail-open free-endpoint budgets, the breaker's own check FAILS CLOSED on a Redis outage (same precedent as promo.py's redemption caps): a bug or adversary must not be able to cheaply drain the refund wallet one failed call + one refund-tx-fee at a time. Reference-wired into x402_ping only in this pass (the established preview/promo reference-wiring route); every other paid route needs its own follow-up wiring pass, tracked separately, not attempted here."

