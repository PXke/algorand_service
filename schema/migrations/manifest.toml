file = "backend/schema/migrations/app/092_x402_features.cql"
tier = "prod"
status = "active"
description = "x402_feature_requests + x402_feature_requests_by_recency + x402_feature_vote_totals + x402_feature_votes: the paid feature-request board for the Algorand Global x402 Challenge (POST /api/v1/x402/features paid, POST /api/v1/x402/features/:request_id/vote paid, GET /api/v1/x402/features free, GET /api/v1/x402/features/demand paid), roadmap item 4 in CLAUDE.md section 9.1 -- agents pay to file a request and pay again to vote demand onto one, builders pay to read the ranked demand, and anyone browses the bare list for free. Four tables rather than the board's two (091) because this product has a second write path, voting, that neither the directory nor the board has. x402_feature_requests is keyed by a hash of the settling payment txid rather than of (submitter, title) the way x402_board_entries keys on (payer, link): a board placement is a rented slot the same payer renews in place, a feature request is an event, so the same wallet asking twice has paid twice and folding those onto one row would silently delete a paid request -- and the txid key means any x402_settlements row from migration 090 traces forward to the request it bought. x402_feature_requests_by_recency is the newest-first projection for the free browse feed, denormalized rather than filtered because ordering by a non-key created_at would need ALLOW FILTERING (same precedent as 089/090/091), on a constant default partition, bounded on purpose and LIMITed on every read, to be sharded by filing month if the board outgrows one partition. Unlike the board there is no term and no expiry: a feature request accumulates demand over time and expiring one would destroy signal its voters paid for. x402_feature_vote_totals holds vote_total as a Cassandra COUNTER in its own table (counter and non-counter columns cannot share a table outside the primary key) because two votes settling at the same instant are two separate payments and a read-modify-write would silently merge them into one increment, under-reporting the paid signal this product sells -- the accepted trade-off is that counter updates are not idempotent under retry, so the store issues exactly one and never retries. There is deliberately NO by-demand ranking projection: a rank table clustered on vote_total would need delete-then-reinsert per vote on precisely the value the counter makes atomic, so concurrent votes would leave stale or duplicate rank rows -- the paid demand read instead scans the bounded partition (LIMITed by x402_features_demand_scan_limit), reads the counters concurrently via execute_parallel_with_args, and sorts in memory, which is exact while the board fits the scan window and wants a sweep-rebuilt projection when it does not. x402_feature_votes is the append-only per-vote audit log (voter, txid, timestamp) with no public read surface, for abuse forensics the counter alone cannot answer, clustered on (voted_at DESC, settlement_tx_id) so two votes in the same millisecond get distinct rows instead of the second overwriting the first. Voting is deliberately uncapped per wallet -- a costly-signal board where the demand number is the money staked, and a per-wallet cap would cost a sybil nothing to route around while costing honest agents the ability to express intensity. No settlement table of its own: feature payments land in x402_settlements from migration 090 via the shared modules/x402/settlement.py ledger"

[[migrations]]
stream = "app"
version = "093"
file = "backend/schema/migrations/app/093_x402_grading.cql"
tier = "prod"
status = "active"
description = "x402_grades + x402_graded_endpoints: the paid endpoint-grading product for the Algorand Global x402 Challenge (POST /api/v1/x402/grades paid, GET /api/v1/x402/grades/score paid, GET /api/v1/x402/grades free), roadmap item 6 in CLAUDE.md section 9.1 -- an agent pays a flat fee to grade ANY http(s) endpoint 1-5 stars with an optional one-line opinion, and anyone pays a higher fee to read that endpoint's credibility-weighted aggregate score. NOTHING CUSTODIAL: the roadmap's \"small stake\" is the one-time payment itself, settled straight to the receive-only payTo, neither table has an escrow, held-balance, refund or forfeiture column, and the credibility weight is a read-time sum over x402_settlements rather than a balance this product controls -- CLAUDE.md section 9 bars holding user funds and the escrow primitive belongs to roadmap item 5's unstarted smart contract. url_hash is this module's OWN SHA-256 of its own normalized URL, not x402_directory's listing id: a graded endpoint need not be listed with us or known to us at all, so this module has no dependency on the directory, and url is denormalized into both tables because the hash is one-way. x402_grades is keyed PRIMARY KEY ((url_hash), grader), which IS the product rule: one grader holds at most one grade per endpoint and re-grading replaces that row rather than stacking a second one -- deliberately unlike the feature board's votes (092), where stacking is the demand signal, because here the read side is a quality score and an average is only meaningful while one wallet contributes one data point. The aggregate (credibility-weighted mean, plain mean, count, 1-5 distribution) is computed in Python over one LIMITed partition read rather than stored in a counter column: a counter cannot be maintained idempotently under the overwrite rule, and decisively the weights are not a property of these rows at all -- a grader's weight moves whenever that wallet pays for anything elsewhere in the marketplace, so any stored aggregate would be stale the moment any grader spent again and only a read-time computation is correct. x402_graded_endpoints is the free existence index (free = existence, paid = signal), denormalized because enumerating distinct url_hash values from x402_grades would be a cluster-wide scan (same precedent as 087/089/090/091) -- constant 'default' partition, bounded on purpose, LIMITed on every read, sharded by month if it ever outgrows one partition; clustered by url_hash rather than a mutable timestamp so one INSERT replaces the row with no delete-then-insert dance, and it doubles as the single-row existence check run BEFORE the paid score lookup takes payment so nobody is charged for an empty aggregate. No settlement table of its own: grading payments land in x402_settlements (090) via the shared modules/x402/settlement.py ledger, which is also READ (whole day partitions, summed in Python, never ALLOW FILTERING, current network only) to total each grader's all-time spend with this marketplace -- the weight their grade carries -- see modules/x402_grading/services/credibility.py for why only the current network counts and why a by-payer projection of x402_settlements is the right long-run shape for that read"

