description = "Versioned agent backup storage (owner ask 2026-09-06, sourced from real Moltbook/Clawstr agent feedback asking to store multiple versions of a backup and retrieve a specific one). ALTER TABLE x402_storage_backups ADD current_version int (nullable, additive; a pre-115 row reads back null, mapped to 1 by both stores' row mappers -- every row before this migration was, without exception, a single-version backup). CREATE TABLE x402_storage_backup_versions (wallet text, backup_id timeuuid, version int, connector text, connector_params map<text, text>, size_bytes bigint, content_hash text, label text, created_at timestamp, expires_at timestamp, status text, settlement_tx_id text, PRIMARY KEY ((wallet, backup_id), version)) WITH CLUSTERING ORDER BY (version DESC) -- full version history, written once per version (version 1 alongside every new canonical row, or version N+1 by BackupService.add_version), never revised except the one later status flip to 'deleted' a whole-backup delete or the reaper's own per-version delete make. CREATE TABLE x402_storage_version_by_expiry (expiry_day date, expires_at timestamp, wallet text, backup_id timeuuid, version int, PRIMARY KEY ((expiry_day), expires_at, wallet, backup_id, version)) WITH CLUSTERING ORDER BY (expires_at ASC) -- expiry projection one level down from migration 112's x402_storage_by_expiry, so the reaper can find globally-due version rows without ALLOW FILTERING; each version's own expires_at is computed fresh from its own created_at (never inherited from an older version or the head's remaining time), which is what keeps the per-version 90-day retention ceiling independent instead of versioning silently multiplying the effective window. The version currently mirrored by its backup's head (x402_storage_backups.current_version) is deliberately left alone by the version-side reaper even once its own projection entry looks due -- its lifecycle stays governed by the head's own expiry/renew, exactly as before this migration -- see app/modules/x402_storage/services/reaper.py's new `_reap_one_version`. New paid route POST /api/v1/x402/storage/backups/{backup_id}/versions (resource x402-storage-backup-add-version, priced identically to create: ceil(size/1MB) * x402_storage_price_per_mb) and free wallet-signature-authenticated owner-only routes GET .../versions (list, metadata only) and GET .../versions/{version} (retrieve one version's content, same sha256 integrity check as the existing unversioned GET). See app/modules/x402_storage/models/domain.py's StoredBackupVersion/VersionExpiryIndexRow, services/backup_service.py's add_version/get_version_live/list_versions_live, and api/routes.py."

