1, an anti-spam-floor price matching x402_scan_price, not cost-recovery) returns daily click counts and a coarse referrer breakdown over up to settings.x402_board_click_history_max_days (30) days, aggregated from up to settings.x402_board_click_history_max_results (2000) raw events -- see BoardService.click_history()'s own docstring for the zero-filled daily buckets and the `capped` truncation-honesty flag. PAID and owner-only, unlike the directory's free probe history: this is one advertiser's own traffic data, not a public trust signal about a callable endpoint. Ownership is proven the same way x402_board_renew's boost already does -- existence and unattributable-payer checks run BEFORE the payment gate (free 404/409), the actual payer-vs-placement.payer match can only be checked AFTER settlement (api/routes.py's _click_history_product, run through run_with_refund's PlatformError contract for a payment-kept 403 on a mismatch). No promo bypass on this route either, same reasoning as x402_board_place/x402_board_renew's own module docstring. See app/modules/x402_board/{models/domain.py,services/board_service.py,stores/{base.py,memory.py,cassandra.py},api/routes.py}, app/core/statements.py's X402BoardStmts (INSERT_BY_CATEGORY/DELETE_BY_CATEGORY/LIST_BY_CATEGORY/INSERT_CLICK_EVENT/LIST_CLICK_EVENTS and the category column added to UPSERT_PLACEMENT/GET_PLACEMENT/INSERT_RECENCY/LIST_RECENT), and app/schemas.py's X402BoardPlacementRequest.category."

