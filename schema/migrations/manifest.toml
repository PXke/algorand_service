description = "x402 probe fairness queue (same-night adversarial review, finding #3, 2026-09-06): the probe sweep's old read (x402_listings_by_recency via algorand_shared.x402_statements.X402ProbeStmts.LIST_LIVE_LISTINGS, 097) was LIMITed and newest-created-first, and that feed's expired rows are never pruned, so once the directory held more than X402_PROBE_MAX_LISTINGS rows total, everything past the newest N permanently fell outside the sweep's read window and silently stopped having its term_end extended -- a healthy, still-paying listing would then expire on schedule and become reclaimable by a new payer for the listing fee. CREATE TABLE IF NOT EXISTS x402_probe_queue (directory text, last_probed_at timestamp, url_hash text, url text, created_at timestamp, tags set<text>, term_end timestamp, payer text, verified_wallet text, category text, PRIMARY KEY ((directory), last_probed_at, url_hash)) WITH CLUSTERING ORDER BY (last_probed_at ASC, url_hash ASC) -- ordered by LEAST-RECENTLY-PROBED instead of most-recently-created, so the sweep round-robins across every live listing over successive runs instead of permanently starving the oldest ones. Seeded by backend at listing create()/relist() time (CassandraListingStore._write_projections, PAID listings only) at last_probed_at = algorand_shared.x402_statements.PROBE_QUEUE_NEVER_PROBED (1970-01-01, an idempotent seed key so repeated relists before a first probe do not duplicate), and repositioned by workers (x402_probe/service.py's CassandraProbeRepository.mark_probed) after every actually-attempted probe -- healthy or not -- by deleting the row at the position it was just read at and inserting a fresh one at last_probed_at = the probe's own timestamp; a listing found expired on read is deleted outright rather than carried forward, pruning a delisted/lapsed listing out of the table within one pass instead of letting it clog the front of the LIMITed read forever. One-off backfill for pre-migration listings: workers/scratch/backfill_x402_probe_queue.py (idempotent, safe to re-run). See shared/algorand_shared/x402_statements.py's X402ProbeStmts.LIST_PROBE_QUEUE/INSERT_PROBE_QUEUE/DELETE_PROBE_QUEUE and workers/app/modules/x402_probe/service.py."

