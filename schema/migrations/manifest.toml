description = "Lets one promo code (100) permit a wallet more than one redemption -- owner ask 2026-09-01, generalized into a per-code setting (max_redemptions_per_wallet, default 1, so every pre-existing code keeps its exact prior one-per-wallet behavior) rather than special-cased for one campaign. ALTER TABLE ADD COLUMN on x402_promo_codes for the new setting -- no primary key involved, safe in place. x402_promo_redemptions cannot hold more than one row per (code, wallet_hash) under its 100 primary key (ONE row per wallet WAS the abuse cap, via INSERT ... IF NOT EXISTS) and Cassandra cannot ALTER a primary key, so this adds a new table, x402_promo_redemptions_v2, PRIMARY KEY ((code, wallet_hash), redemption_id) CLUSTERING ORDER BY (redemption_id DESC) -- partitioned by (code, wallet_hash) so 'how many has this wallet redeemed' is one bounded single-partition read. redemption_id is a server-generated (now()) timeuuid, not a Python-supplied redeemed_at timestamp: an earlier draft of this migration clustered on redeemed_at (second precision) and it collided under realistic rapid same-wallet redemptions -- exactly the use case this migration exists for -- wrongly rejecting a genuine 2nd/3rd/4th redemption as an exact duplicate; timeuuid via now() is collision-proof by construction and always fresh, so the INSERT is a plain INSERT now, not IF NOT EXISTS (an LWT here would never reject anything). redeemed_at is kept as a plain non-key column for human-facing display. The abuse cap itself moves to Redis: a new per-(code, wallet_hash) counter, INCR-with-cap against max_redemptions_per_wallet, mirroring the existing global remaining-count DECR pattern in modules/x402/promo.py -- this table returns to being purely the durable audit log, same role x402_promo_codes plays for the total budget. The 100 table is left in place, untouched, holding exactly the redemption history written before this migration (2 rows as of this migration) -- nothing backfilled, nothing lost, simply nothing further appended to it; all reads/writes after this migration target x402_promo_redemptions_v2. See app/modules/x402/promo.py."

