# CQL migration registry (stdlib TOML — no PyYAML required).
# Docs: docs/architecture/cql-migrations.md

keyspace = "algorand_platform"

[streams.ledger]
description = "Shared migration ledger (always first)."

[streams.chain]
description = "On-chain tables written by Conduit cassandra exporter."
legacy_monolith = "conduit/schema/cassandra.cql"

[streams.app]
description = "Application tables (Robyn API, workers)."
legacy_monolith = "backend/schema/cassandra_app.cql"

[[migrations]]
stream = "ledger"
version = "000"
file = "schema/migrations/ledger/000_schema_migrations.cql"
tier = "prod"
status = "active"
description = "schema_migrations ledger table"

[[migrations]]
stream = "chain"
version = "001"
