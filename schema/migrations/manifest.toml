description = "Usage-proof-of-payment for grading (owner ask 2026-09-02, tx_id made MANDATORY on every grade submission per a same-day correction: 'no txid, no grade, full stop'). ALTER TABLE x402_grades ADD usage_verified boolean -- nullable, no primary key involved, safe in place; a pre-103 row reads back null, mapped to False in Python (CassandraGradeStore._row_to_grade), never a false claim of verification. Does NOT change credibility weighting (services/credibility.py, untouched) -- a visible per-grade flag only, not a new weight input. Verification (services/usage_proof.py) is independent on-chain fact-checking, never correctness: given a grader-cited txid, confirm on the public indexer that its sender is the same wallet paying the grading fee and its receiver is the graded endpoint's own payTo -- proves engagement, never what the endpoint returned. The expected payTo comes from whichever source applies (grading has never required a directory listing, and this does not narrow that): a directory-listed URL's newest probe result (payto_seen, 097), or -- for any other gradeable http(s) URL -- a live SSRF-guarded fetch of its own 402 offer (services/usage_proof.fetch_live_payto, reusing media.api.routes._resolve_public_ip exactly like x402_scan already does, and the same GET-then-POST-on-405 retry + header-then-body offer decode workers/x402_probe/probe.py already uses, reachable from backend/ instead of workers/). Receiver-side checks (txid exists, receiver matches) run BEFORE the payment gate as free 400s; the sender-side check (does the txid belong to the wallet actually paying) can only run AFTER the gate settles a real payer, and a mismatch there is rejected the same way an unattributable payer already is -- payment taken, no grade stored, no refund on this path. x402_grading_usage_proof_required (default True) governs only the indexer-unreachable case: True blocks submission until the indexer answers again; False is an operator escape hatch that still stores the grade with usage_verified=False. See app/modules/x402_grading/services/usage_proof.py."

