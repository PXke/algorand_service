description = "x402 directory category + renew + detail view (roadmap item 3). Adds a category text column to x402_listings and both projections (x402_listings_by_recency 090, x402_listings_by_tag 096): one of a fixed enum (data, ai, finance, identity, storage, compute, social, tooling, other) defined in x402_directory/models/domain.py, validated BEFORE the payment gate so nobody pays for an unknown category, defaulting to other; a null (pre-099 row) reads back as other, no backfill. GET /api/v1/x402/search?category= needs no new table: the category is projected into the existing by-tag table as one extra row per listing under the reserved tag category:<name>, written and deleted next to the real tag rows from the single StoredListing.projection_tags() key set, so the filter is the same single-partition LIMITed read as ?tag= with no ALLOW FILTERING; user tags in the category: namespace are refused pre-gate. The paid POST /api/v1/x402/list/renew (listing price, body {url}) needs no schema: 404 before the gate if unlisted, then rewrites the rows with term_end = max(now, term_end) + term, created_at untouched (a renewal buys time, not a jump to the front of the feed), settlement_tx_id and payer replaced, verified badge kept only if the payer is unchanged; both projections are keyed on created_at so the full INSERTs rewrite every row in place and carry the new term_end. Only the current owner may renew a live listing; an unowned or expired one may be renewed by anyone -- same rule and same accepted after-settlement 403 tradeoff as the relist check (094) and the board's renew (098). The free rate-limited GET /api/v1/x402/listings?url= detail view (listing JSON plus its newest probe, 404 if unlisted or expired) is two existing point reads and no schema."
[[migrations]]
