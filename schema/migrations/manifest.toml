description = "Adds a payer column to x402_listings and x402_listings_by_recency (090), closing a real gap found during a design review: the directory was keyed purely by hash(url) with no ownership record, so ANY payer could pay the listing fee for an already-listed url and silently overwrite its price, description, assets, and schema -- a live misinformation vector, not cosmetic griefing, since a listing makes a factual claim about a real third-party endpoint other agents are meant to trust. Deliberately NOT the same fix as x402_board's (payer, link) partition key: the directory's whole point is one canonical entry per url (090's own comment: re-listing overwrites by design), so keying on (payer, url) would let two payers list the same url as two competing entries and fragment search results for what is supposed to be a single source of truth. Instead url_hash stays the sole key and this migration only adds who currently owns that entry; the refusal of a relist by a different payer happens at the service layer (listing_service.py), not in CQL. An empty existing payer (any listing created before this migration) is treated as unowned, so the first relist under the new rule claims it rather than permanently locking out every pre-migration listing."
[[migrations]]
stream = "app"
version = "095"
file = "backend/schema/migrations/app/095_x402_settlement_fulfillment.cql"
tier = "prod"
status = "active"
description = "Adds a fulfilled boolean to x402_settlements (090) and a by-txid lookup table x402_settlements_by_tx, closing a real gap found in an independent review: require_paid_request settles the payment and writes the ledger row, then the route's product write runs -- if that write raised, the payer was charged with no durable record that they received nothing, and because the replay claim is only released on payment failure a retry of the same header was a 409. fulfilled is written false on every settlement (full INSERT, never a partial UPDATE) and flipped true by modules/x402/settlement.py's mark_fulfilled, which routes call only after their product write succeeded (store before mark, CLAUDE.md section 2 invariant 2); a row that stays false is a paid-but-unfulfilled settlement for an operator to reconcile. x402_settlements_by_tx exists because the ledger is keyed ((day), settled_at, tx_id) and a route only holds the txid, so finding the row by tx_id alone would need ALLOW FILTERING on a non-partition column (section 4: add a lookup table instead, same precedent as 087/089); it denormalizes the whole row, is written second so its presence implies the ledger row exists, and mark_fulfilled reads it first and refuses to UPDATE without a hit so it can never upsert a phantom ledger row. Rows written before this migration read fulfilled as null (treated as unfulfilled by readers) and have no by-tx row; no backfill is performed. The replay claim is deliberately NOT released for an unfulfilled settlement: the payment is already committed on-chain so the facilitator could not settle it again, and releasing would only turn a 409 into a 402 while opening a double-fulfillment window."
