ignature always covers the FULL response hash regardless. See app/modules/x402/receipt_store.py (storage), app/modules/x402/receipts.py (signing/generation, hooked into run_with_refund's success path so every route using it gets a receipt automatically once the key is configured), and app/modules/x402_receipts/api/routes.py (the free GET /api/v1/x402/receipts/{receipt_id} read endpoint)."

