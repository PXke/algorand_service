description = "add articles_slug_sai (SAI on articles.slug) and drop articles_by_slug: same precedent 067_articles_consolidated.cql set for article_id -- SAI supports point queries without the partition key, so slug uniqueness/lookup moves fully onto articles itself, closing the write-back-drift class (a claim recorded in articles_by_slug that never got written back onto the owning article) by construction instead of needing a reconciliation beat to detect it. Trades away articles_by_slug's atomic IF NOT EXISTS claim -- accepted deliberately since this pipeline composes/publishes one article at a time (single compose slot, 1-slot review queue, per-service cooldown), so two writers racing on the identical slug text is not a real exposure; ensure_article_slug (shared/algorand_shared/slugs.py) now does a single check-then-write directly against articles instead of a separate claim-then-write-back across two tables/three call sites"

