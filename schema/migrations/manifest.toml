wo independently-bounded sources and only ever appends auto-discovered rows AFTER every live paid listing already found, never interleaved by recency. A 'claim' (a real payer relisting a url whose only existing listing was an auto-discovered stub) works through the EXISTING create() ownership rule unchanged (an auto-discovered row's payer is always empty, so it reads as unowned) -- CassandraListingStore._write_projections' new claim-transition branch deletes the stub's row from this table and writes the fresh paid row into the normal projections instead. See app/modules/x402_directory/services/discovery_import.py (the import job; a GET-only fetch against the facilitator's own public discovery feed, zero payment anywhere in this path) and the admin-triggered POST /api/v1/admin/x402/directory/import-discovered route in api/routes.py."

