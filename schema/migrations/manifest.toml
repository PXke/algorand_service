l' pseudo-category (EcosystemStmts.ALL_CATEGORY_PARTITION, mirrors x402_directory's DIRECTORY_PARTITION) for the unfiltered index, never ALLOW FILTERING (CLAUDE.md section 4). CREATE TABLE ecosystem_projects_by_tag (tag, approved_at, slug, name, domain, url, description, category, stage, open_source boolean, editor_pick boolean, x402_url, PRIMARY KEY ((tag), approved_at, slug)) WITH CLUSTERING ORDER BY (approved_at DESC, slug ASC) -- one row per free tag (design doc section 4: one closed category plus free multi-tags). CREATE TABLE ecosystem_submissions_by_status (status, submitted_at, slug, name, domain, url, category, source, PRIMARY KEY ((status), submitted_at, slug)) WITH CLUSTERING ORDER BY (submitted_at DESC, slug ASC) -- the admin review-queue read; a row moves partition on every decision via full delete-then-insert (CLAUDE.md section 3: articles_feed's partial-UPDATE phantom-row lesson). See backend/app/modules/ecosystem/{models/domain.py,stores/{base.py,memory.py,cassandra.py,factory.py},services/{submission_service.py,review_service.py,rate_limit.py,blurb_service.py},api/routes.py}, shared/algorand_shared/ecosystem_statements.py's EcosystemStmts, and workers/app/modules/ecosystem_probe/ for the periodic liveness re-check + blurb-draft task."

