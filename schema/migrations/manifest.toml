description = "Promo-code payment bypass, shared across every x402 module (CLAUDE.md section 9). x402_promo_codes (code PRIMARY KEY, resource, starting_count, created_at, expires_at, active) is the durable admin-managed record: POST /api/v1/admin/x402/promo creates one scoped to exactly one paid resource via an INSERT ... IF NOT EXISTS lightweight transaction (two concurrent admin creates of the same code cannot silently overwrite each other), DELETE /api/v1/admin/x402/promo?code= deactivates via UPDATE ... IF EXISTS (same precedent as the probe badge, 097 -- never upserts a phantom row for a code that was never created). starting_count is the durable total redemption budget; the actual hot-path guard is a Redis key modules/x402/promo.py seeds from it on first use (SET NX) and DECRements atomically per attempt, undoing (re-incrementing) on exhaustion or on any later rejection -- this table is read once per attempt to resolve the code, never on the DECR itself. expires_at is nullable and checked in Python against wall-clock time, deliberately not a Cassandra TTL, so an expired code stays visible to an admin instead of vanishing from the audit trail. x402_promo_redemptions ((code), wallet_hash, redeemed_at, resource) is the append-only audit log AND the whole per-(code, wallet) abuse cap in one: its primary key IS (code, wallet_hash), so the INSERT ... IF NOT EXISTS that writes the audit row is also the atomic once-per-wallet-per-code claim -- no separate read-then-write race (section 3). wallet_hash is a sha256 hex digest of the caller-supplied wallet address (?promo_wallet=); the raw address is never stored or logged for this feature, and the wallet is checked for syntactic validity only (algosdk.encoding.is_valid_address) -- an owner-accepted soft deterrent, not cryptographic proof of ownership. A redemption is never a payment: it carries no settlement_tx_id and never reaches x402_settlements (090) -- record_settlement is not called on this path. Redis is unreachable -> promo redemption FAILS CLOSED (falls through to the normal paid gate, which still works); any other promo failure (bad code, wrong resource, expired, exhausted, already redeemed by this wallet, invalid wallet, rate-limited IP) falls through the same way -- a promo failure is never itself a 402/error the caller cannot route around. See app/modules/x402/promo.py."

