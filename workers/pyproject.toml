[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorand-platform-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "celery>=5.4.0",
  "redis>=5.0.0",
  "bugsnag>=4.6.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "playwright>=1.45.0",
  "cassandra-driver>=3.29.0",
  "typesense>=0.21.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
  "pypdf>=4.0.0",
  "pillow>=10.0.0",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
  "vulture>=2.14",
]
# Local MTTH gatekeeper (ModernBERT) + local_translate.py's CPU translation
# engines (MiLMMT, SeamlessM4T). Heavy + CPU-tuned. Deploy uses one shared
# venv for every service (see deploy.sh), so this extra is compiled into the
# base requirements.lock.txt rather than kept out of it — every service gets
# torch/transformers on disk, but only the dedicated gatekeeper-eval and
# celery-translate workers ever actually import them at runtime.
#
# intel-extension-for-pytorch (IPEX) was dropped 2026-08-01: no wheel exists
# for this project's pinned Python 3.14 at all, and the one version range
# that would otherwise resolve (2.2.0-2.5.0) is yanked upstream for a
# security issue -- `uv pip compile` cannot solve this extra with IPEX in it,
# full stop, on any Python 3.14 install. This extra had never actually been
# locked/deployed before (requirements.lock.txt had no ml packages in it at
# all until this same date), so this was a latent, pre-existing gap, not a
# regression. Training/inference already fall back to plain torch without
# IPEX per the gatekeeper's own code -- nothing here needed it.
ml = [
  "torch>=2.2.0",
  "transformers>=4.48.0",
  "sentencepiece>=0.2.0",
  # SeamlessM4T's tokenizer.model is a genuine SentencePiece binary file.
  # transformers' slow-to-fast conversion needs `protobuf` to parse it via
  # SentencePieceExtractor; without it, transformers silently falls back to
  # treating the file as a tiktoken vocab (it is not), which fails parsing
  # a random byte as "token rank" (found 2026-08-02, second pass: the first
  # attempt at this fix added tiktoken instead, on the mistaken read that the
  # fallback path's error was the real one -- deleting the cached tokenizer
  # and forcing a clean re-download reproduced the identical failure on a
  # freshly-fetched file, proving it's the upstream file's real format, not
  # a corrupted local cache).
  "protobuf>=4.25.0",
  # Belt-and-suspenders: some HF tokenizer paths still probe for a tiktoken
  # vocab before falling back to SentencePiece, so this stays locked too.
  "tiktoken>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# See the note in backend/pyproject.toml: resolve algorand_shared from the repo
# rather than from the venv .pth that link_shared.sh writes in prod.
pythonpath = [".", "../shared"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "D",
  "C",
  "B",
  "C90",
  "I",
  "UP",
  "ANN",
  "A",
  "C4",
  "DTZ",
  "LOG",
  "T20",
  "PT",
  "RSE",
  "RET",
  "SIM",
  "ARG",
  "PTH",
  "TD",
  "FIX",
  "RUF",
  "PERF",
]
# RUF001/RUF002: en-dash/minus-sign are intentional typography in LLM prompts
# and docstrings, not typos for hyphen-minus.
ignore = ["RUF001", "RUF002"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
