[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorand-platform-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "celery>=5.4.0",
  "redis>=5.0.0",
  "bugsnag>=4.6.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "playwright>=1.45.0",
  "cassandra-driver>=3.29.0",
  "typesense>=0.21.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
  "pypdf>=4.0.0",
  "pillow>=10.0.0",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
  "vulture>=2.14",
]
# Local MTTH gatekeeper (ModernBERT). Heavy + CPU-tuned; installed only on the
# dedicated evaluation worker, never pulled into the base runtime. IPEX is
# optional at runtime — training/inference fall back to plain torch without it.
ml = [
  "torch>=2.2.0",
  "transformers>=4.48.0",
  "intel-extension-for-pytorch>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/RUF002: en-dash/minus-sign are intentional typography in LLM prompts
# and docstrings, not typos for hyphen-minus.
ignore = ["RUF001", "RUF002"]
