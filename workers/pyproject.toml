[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorand-platform-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "celery>=5.4.0",
  "redis>=5.0.0",
  "bugsnag>=4.6.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "playwright>=1.45.0",
  "cassandra-driver>=3.29.0",
  "typesense>=0.21.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
  "pypdf>=4.0.0",
  "pillow>=10.0.0",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
  "vulture>=2.14",
]
# Local MTTH gatekeeper (ModernBERT). Heavy + CPU-tuned; installed only on the
# dedicated evaluation worker, never pulled into the base runtime. IPEX is
# optional at runtime — training/inference fall back to plain torch without it.
ml = [
  "torch>=2.2.0",
  "transformers>=4.48.0",
  "intel-extension-for-pytorch>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# See the note in backend/pyproject.toml: resolve algorand_shared from the repo
# rather than from the venv .pth that link_shared.sh writes in prod.
pythonpath = [".", "../shared"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "D",
  "C",
  "B",
  "C90",
  "I",
  "UP",
  "ANN",
  "A",
  "C4",
  "DTZ",
  "LOG",
  "T20",
  "PT",
  "RSE",
  "RET",
  "SIM",
  "ARG",
  "PTH",
  "TD",
  "FIX",
  "RUF",
  "PERF",
]
# RUF001/RUF002: en-dash/minus-sign are intentional typography in LLM prompts
# and docstrings, not typos for hyphen-minus.
ignore = ["RUF001", "RUF002"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
