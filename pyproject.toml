# Repo-wide dev tooling (backend/workers keep their own package config).

[tool.vulture]
paths = [
  "backend/app",
  "workers/app",
  "workers/tests",
  "deploy/scripts/cql_migrate.py",
  "deploy/scripts/seed_service_registry.py",
]
exclude = ["*/tests/*", "*/.venv/*"]
min_confidence = 80
ignore_decorators = [
  "@app.get",
  "@app.post",
  "@app.put",
  "@app.patch",
  "@app.delete",
  "@celery_app.task",
  "@pytest.fixture",
  # Celery signal handlers are invoked by the framework, never called directly.
  "@worker_process_init.connect",
  "@task_prerun.connect",
  "@task_postrun.connect",
  "@task_failure.connect",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "D",
  "C",
  "B",
  "C90",
  "I",
  "UP",
  "ANN",
  "A",
  "C4",
  "DTZ",
  "LOG",
  "T20",
  "PT",
  "RSE",
  "RET",
  "SIM",
  "ARG",
  "PTH",
  "TD",
  "FIX",
  "RUF",
  "PERF",
]
# RUF001/RUF002: en-dash/minus-sign are intentional typography in LLM prompts
# and docstrings, not typos for hyphen-minus.
ignore = ["RUF001", "RUF002"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"backend/tests/test_arc0060_verify.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
