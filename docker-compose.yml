# TESTING ONLY — local deps, unit tests, optional app + Algorand localnet.
# Production: deploy/README.md (package.sh, systemd).
#
#   make docker-test              # build once + lint + pytest in container
#   make docker-app               # deps + API + Celery
#   make docker-localnet          # deps + app + algod (private network)
#
# Localnet + Conduit chain ingest:
#   COMPOSE_PROFILES=localnet,chain docker compose --env-file docker/localnet/.env up -d

name: algorand-platform-test

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-platform-image: &platform_image
  image: algorand-platform-test:${PLATFORM_TAG:-local}
  pull_policy: build
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PLATFORM_DEV: ${PLATFORM_DEV:-1}

x-platform-app: &platform_app
  <<: *platform_image
  env_file:
    - path: docker/.env
      required: false
  logging: *default_logging

services:
  cassandra:
    image: cassandra:4.1
    restart: unless-stopped
    logging: *default_logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    environment:
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s
    volumes:
      - cassandra_test_data:/var/lib/cassandra

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default_logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    logging: *default_logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    command: ["--data-dir", "/data", "--api-key=changeme", "--enable-cors"]
    ports:
      - "8108:8108"
    healthcheck:
      # typesense/typesense uses /bin/sh (no bash /dev/tcp, no curl). Listen check on :8108 (hex 1FAC).
      test: ["CMD-SHELL", "grep -q ':1FAC' /proc/net/tcp || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    volumes:
      - typesense_test_data:/data

  migrate:
    <<: *platform_image
    logging: *default_logging
    command: ["/bin/bash", "/usr/local/bin/platform-docker/migrate-and-seed.sh"]
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE: algorand_platform
      CASSANDRA_LOCAL_DC: datacenter1
      SEED_SERVICE_REGISTRY: "1"
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"

  # Algorand private network (Sandbox-style dev node). Token: see docker/localnet/.env.example
  algod:
    profiles: ["localnet"]
    image: makerxau/algorand-sandbox-dev:latest
    restart: unless-stopped
    logging: *default_logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      ALGOD_TOKEN: ${ALGOD_TOKEN:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
    ports:
      - "4001:4001"
      - "4002:4002"
    healthcheck:
      # Sandbox image has no curl; algod listens on IPv6 :4001 (see /proc/net/tcp6, port 0FA1).
      test: ["CMD-SHELL", "grep -q ':0FA1' /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  test:
    profiles: ["test"]
    <<: *platform_image
    logging: *default_logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    command: ["/usr/local/bin/platform-docker/run-tests.sh"]
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE: algorand_platform
      CASSANDRA_LOCAL_DC: datacenter1
      REDIS_URL: redis://redis:6379/0
      SKIP_ARC0060_TESTS: ${SKIP_ARC0060_TESTS:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    <<: *platform_app
    restart: unless-stopped
    working_dir: /app/backend
    command: ["python", "-m", "app.main"]
    ports:
      - "8080:8080"
    environment: &platform_test_env
      APP_ENV: test
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      REDIS_URL: redis://redis:6379/0
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE: algorand_platform
      CASSANDRA_LOCAL_DC: datacenter1
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: changeme
      NEWS_STORE: cassandra
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      SUGGESTION_STORE: memory
      UPVOTE_STORE: memory
      AUTH_DOMAIN: localhost
      AUTH_URI: https://localhost/sign-in
      CORS_ALLOWED_ORIGINS: >-
        http://localhost:8080,http://127.0.0.1:8080,
        http://localhost:5173,http://127.0.0.1:5173
      ALGOD_URL: ${ALGOD_URL:-https://testnet-api.algonode.cloud}
      ALGOD_TOKEN: ${ALGOD_TOKEN:-}
      ADMIN_WALLET_ADDRESSES: ${ADMIN_WALLET_ADDRESSES:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    profiles: ["app"]
    <<: *platform_app
    restart: unless-stopped
    working_dir: /app/workers
    command:
      [
        "celery",
        "-A",
        "app.celery_app",
        "worker",
        "--loglevel=INFO",
        "-c",
        "2",
        "-Q",
        "default,scrape,pipeline,security,chain",
      ]
    environment:
      <<: *platform_test_env
      REDIS_BROKER_URL: redis://redis:6379/1
      REDIS_RESULT_URL: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_SCRAPE_MODE: ${DISCORD_SCRAPE_MODE:-web}
      TELEGRAM_SCRAPE_MODE: ${TELEGRAM_SCRAPE_MODE:-web}
      DISCORD_MESSAGE_LIMIT: ${DISCORD_MESSAGE_LIMIT:-50}
      DISCORD_POLL_SECONDS: ${DISCORD_POLL_SECONDS:-300}
      PRICE_ANALYSIS_ENABLED: ${PRICE_ANALYSIS_ENABLED:-1}
      PRICE_ANALYSIS_ASSET_ID: ${PRICE_ANALYSIS_ASSET_ID:-algorand}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-algorand-platform-newspaper/1.0}
      REDDIT_POST_LIMIT: ${REDDIT_POST_LIMIT:-25}
      REDDIT_POLL_SECONDS: ${REDDIT_POLL_SECONDS:-600}
      MISTRAL_ENABLED: ${MISTRAL_ENABLED:-0}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_FALLBACK_TEMPLATE: ${MISTRAL_FALLBACK_TEMPLATE:-1}
      MISTRAL_DIFF_POLL_SECONDS: ${MISTRAL_DIFF_POLL_SECONDS:-600}
      PRICE_METRICS_ENABLED: ${PRICE_METRICS_ENABLED:-1}
      PRICE_METRICS_ASSET_ID: ${PRICE_METRICS_ASSET_ID:-algorand}
      PRICE_METRICS_POLL_SECONDS: ${PRICE_METRICS_POLL_SECONDS:-600}
      NEWS_MAX_ARTICLES_PER_DAY: ${NEWS_MAX_ARTICLES_PER_DAY:-7}
      NEWS_STRICT_DAILY_CAP: ${NEWS_STRICT_DAILY_CAP:-1}
      CRAWL_PAUSE_WHEN_PUBLISH_CAP_FULL: ${CRAWL_PAUSE_WHEN_PUBLISH_CAP_FULL:-1}
      BREAKING_INLINE_DRAIN: ${BREAKING_INLINE_DRAIN:-0}
      NEWS_MAX_BREAKING_PER_DAY: ${NEWS_MAX_BREAKING_PER_DAY:-2}
      NEWS_STANDARD_INTERVAL_HOURS: ${NEWS_STANDARD_INTERVAL_HOURS:-3}
      NEWS_MIN_DIFF_LINES: ${NEWS_MIN_DIFF_LINES:-3}
      PUBLISH_IMMEDIATE_PRIORITY: ${PUBLISH_IMMEDIATE_PRIORITY:-95}
      PUBLISH_QUEUE_DRAIN_SECONDS: ${PUBLISH_QUEUE_DRAIN_SECONDS:-900}
      PUBLISH_BREAKING_DRAIN_SECONDS: ${PUBLISH_BREAKING_DRAIN_SECONDS:-120}
      PUBLISH_QUEUE_BATCH_LIMIT: ${PUBLISH_QUEUE_BATCH_LIMIT:-50}
      BREAKING_MISTRAL_CREDIBILITY: ${BREAKING_MISTRAL_CREDIBILITY:-0}
      OFFICIAL_DISCORD_CHANNEL_IDS: ${OFFICIAL_DISCORD_CHANNEL_IDS:-}
      OFFICIAL_MAIL_FROM_DOMAINS: ${OFFICIAL_MAIL_FROM_DOMAINS:-algorand.foundation,algorand.com}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-}
      MAIL_IMAP_USER: ${MAIL_IMAP_USER:-}
      MAIL_IMAP_PASSWORD: ${MAIL_IMAP_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-300}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-300}
      SCRAPE_COOLDOWN_SECONDS: ${SCRAPE_COOLDOWN_SECONDS:-3600}
      REDDIT_OAUTH_ENABLED: ${REDDIT_OAUTH_ENABLED:-0}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      WEEKLY_DIGEST_MAX_BODY_CHARS: ${WEEKLY_DIGEST_MAX_BODY_CHARS:-1500}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "grep -aq celery /proc/1/cmdline && grep -aq worker /proc/1/cmdline || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  beat:
    profiles: ["app"]
    <<: *platform_app
    restart: unless-stopped
    working_dir: /app/workers
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO"]
    environment:
      <<: *platform_test_env
      REDIS_BROKER_URL: redis://redis:6379/1
      REDIS_RESULT_URL: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_SCRAPE_MODE: ${DISCORD_SCRAPE_MODE:-web}
      TELEGRAM_SCRAPE_MODE: ${TELEGRAM_SCRAPE_MODE:-web}
      DISCORD_POLL_SECONDS: ${DISCORD_POLL_SECONDS:-300}
      PRICE_ANALYSIS_ENABLED: ${PRICE_ANALYSIS_ENABLED:-1}
      PRICE_ANALYSIS_ASSET_ID: ${PRICE_ANALYSIS_ASSET_ID:-algorand}
      PRICE_ANALYSIS_CRON_DOW: ${PRICE_ANALYSIS_CRON_DOW:-mon}
      PRICE_ANALYSIS_CRON_HOUR: ${PRICE_ANALYSIS_CRON_HOUR:-9}
      PRICE_ANALYSIS_CRON_MINUTE: ${PRICE_ANALYSIS_CRON_MINUTE:-0}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-algorand-platform-newspaper/1.0}
      REDDIT_POLL_SECONDS: ${REDDIT_POLL_SECONDS:-600}
      MISTRAL_DIFF_POLL_SECONDS: ${MISTRAL_DIFF_POLL_SECONDS:-600}
      PRICE_METRICS_ENABLED: ${PRICE_METRICS_ENABLED:-1}
      PRICE_METRICS_ASSET_ID: ${PRICE_METRICS_ASSET_ID:-algorand}
      PRICE_METRICS_POLL_SECONDS: ${PRICE_METRICS_POLL_SECONDS:-600}
    depends_on:
      worker:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "grep -aq celery /proc/1/cmdline && grep -aq beat /proc/1/cmdline || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  conduit:
    profiles: ["chain"]
    build:
      context: .
      dockerfile: docker/Dockerfile.conduit
    pull_policy: build
    restart: unless-stopped
    logging: *default_logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x conduit >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|__ALGOD_NETADDR__|$$ALGOD_NETADDR|g" \
            -e "s|__ALGOD_TOKEN__|$$ALGOD_TOKEN|g" \
            /config/conduit.template.yml > /tmp/conduit.yml
        exec conduit -f /tmp/conduit.yml
    volumes:
      - ./docker/conduit/conduit.docker.yml:/config/conduit.template.yml:ro
      - conduit_test_data:/data
    environment:
      ALGOD_NETADDR: ${ALGOD_NETADDR:-http://algod:4001}
      ALGOD_TOKEN: ${ALGOD_TOKEN:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
    depends_on:
      migrate:
        condition: service_completed_successfully
      cassandra:
        condition: service_healthy
      algod:
        condition: service_healthy
        required: false

volumes:
  cassandra_test_data:
  typesense_test_data:
  conduit_test_data:
