# Discord rooms for the newspaper crawler (Bot API).
# Requires DISCORD_BOT_TOKEN and bot invited to the server with Read Message History.
#
# scrape_url forms:
#   discord://channel/<CHANNEL_ID>
#   discord:<CHANNEL_ID>
#
# Load:
#   SEED_FILE=deploy/seeds/discord_services.toml python3 deploy/scripts/seed_service_registry.py
#
# Replace CHANNEL_ID values with your two room IDs (Developer Mode → Copy Channel ID).

[[services]]
service_id = "discord-room-1"
display_name = "Discord — Room 1"
match_kind = "address"
# Optional: on-chain trigger address; use a placeholder if poll-only.
match_value = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAY5HFKQ"
scrape_url = "discord://channel/REPLACE_CHANNEL_ID_1"
enabled = true

[[services]]
service_id = "discord-room-2"
display_name = "Discord — Room 2"
match_kind = "address"
match_value = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAY5HFKQ"
scrape_url = "discord://channel/REPLACE_CHANNEL_ID_2"
enabled = true
