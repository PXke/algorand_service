# Training-only NEGATIVE seeds for the classifier/grader bootstrap sprint.
# These are deliberately off-topic / adjacent sources we expect to REJECT, to
# balance the (mostly positive) live Algorand sources. Reject them in the Review
# tab with "Training mode" ON so they train both models WITHOUT publishing.
#
# AFTER the sprint: disable these (set enabled = false and re-seed) or delete the
# rows so they stop being scraped — we don't want amazon.fr composing forever.
#
# Load on the host (from the release root, workers.env sourced for CASSANDRA_*):
#   set -a; source ~/algorand-platform/shared/workers.env; set +a
#   SEED_FILE=deploy/seeds/training_seeds.toml \
#     ~/algorand-platform/venv/bin/python deploy/scripts/seed_service_registry.py
#
# Field notes:
#   service_id   stable unique id (domain with dots -> dashes)
#   display_name human label shown in admin
#   match_kind   "domain" for web sources
#   match_value  the registrable domain
#   scrape_url   the page to scrape (https://…)
#   enabled      true to crawl it; flip to false to retire after the sprint

[[services]]
service_id = "amazon-fr"
display_name = "Amazon FR (training: reject)"
match_kind = "domain"
match_value = "amazon.fr"
scrape_url = "https://www.amazon.fr/"
enabled = true

