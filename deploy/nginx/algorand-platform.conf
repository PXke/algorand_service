# PXke Algorand Projects — algorand.pxke.me (Flutter web) +
# algorand-api.pxke.me (backend proxy). Rendered by deploy.sh; installed as
# its own site file, never touching the host's existing vhosts. Also owns the
# 410 tombstone vhosts for the retired blog.pxke.me and bare pxke.me (bottom
# of file).
upstream algorand_api { server 127.0.0.1:@APP_PORT@; keepalive 32; }

# Redirect plain HTTP to HTTPS (otherwise requests fall into the host's
# default :80 vhost).
server {
    listen 80;
    server_name @SITE_DOMAIN@ @API_DOMAIN@;
    return 301 https://$host$request_uri;
}

# NOTE on the blog.pxke.me leak (2026-07-16/17): unmatched hostnames on :443
# used to fall through to this app's first server block as the IMPLICIT
# default (no block anywhere declared `default_server` for :443). The actual
# fix — `listen 443 ssl default_server; ssl_reject_handshake on;` — lives at
# the HOST level in /etc/nginx/sites-enabled/default, alongside this box's
# other vhosts (eatilla.pxke.me, ritmo.biekos.com), not here: a per-app site
# file is the wrong layer for a host-wide catch-all, and declaring it here
# too produced "a duplicate default server for 0.0.0.0:443" against the host
# file (caught by deploy.sh's nginx -t gate before anything went live).
# A NAMED server block for blog.pxke.me (and bare pxke.me) is a different
# story — no default_server conflict — so their 410 tombstones live at the
# end of this file.

# --- Web app (Vite SPA build from deploy.sh) -----------------------------------
server {
    listen 443 ssl;
    listen 443 quic reuseport;   # HTTP/3 — stripped at install if nginx lacks QUIC
    http2 on;
    http3 on;
    server_name @SITE_DOMAIN@;

    ssl_certificate /etc/letsencrypt/live/@SITE_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@SITE_DOMAIN@/privkey.pem;

    # Tell clients HTTP/3 is available (big win on lossy / high-latency links).
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # Security headers (securityheaders.com F -> A, 2026-08-10). nginx drops
    # ALL inherited add_headers in any location that sets its own (same
    # gotcha as Alt-Svc above) -- these are duplicated into every location
    # below that already has its own add_header block. CSP ships
    # Report-Only for now: this app talks to several third-party domains at
    # runtime (Pera Connect's WalletConnect bridge, its own algod/indexer
    # mirrors, Google Fonts, S3-hosted wallet icons) that were enumerated
    # from the bundled library source, not observed live in a browser --
    # Report-Only logs violations to the console without blocking anything,
    # so a missed domain fails safe. Flip to enforcing (drop "-Report-Only")
    # once a live session confirms zero console violations.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://perawallet.s3-eu-west-3.amazonaws.com https://s3.amazonaws.com; connect-src 'self' https://algorand-api.pxke.me https://wallet-connect-a.perawallet.app wss://wallet-connect-a.perawallet.app https://bridge.walletconnect.org wss://bridge.walletconnect.org https://wc.perawallet.app wss://wc.perawallet.app https://mainnet-api.algonode.cloud https://indexer-mainnet.chain.perawallet.app https://node-mainnet.chain.perawallet.app; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    # COOP/CORP only (2026-08-11, MDN Observatory follow-up) -- safe to ship
    # enforcing immediately, unlike CSP: this site has no cookies/session
    # state to isolate (wallet auth is client-side signature-based, not
    # cookie-based), so COOP same-origin has nothing to break. CORP is
    # deliberately the PERMISSIVE value (cross-origin, not same-origin) --
    # OG cards, article images and the news/RSS feed are meant to be
    # embedded by other sites (Twitter/Bluesky/Telegram link previews); a
    # stricter CORP would silently break those. Cross-Origin-Embedder-Policy
    # is deliberately NOT set: require-corp would need every third-party
    # resource this app loads (Google Fonts, S3-hosted wallet icons, the
    # WalletConnect bridge) to send its own CORP header, which is outside
    # this app's control and could break wallet login the same way a wrong
    # CSP could -- needs the same live-browser verification as flipping CSP
    # to enforcing before it ships.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    root @TARGET_PATH@/releases/current/frontend_web;
    index index.html;

    # Shared upstream-proxy headers for the SEO-rendered document routes below.
    # Set at server scope so each proxy location can inherit them (a location
    # that declares its OWN proxy_set_header would drop these, like add_header).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --- Server-rendered document routes -------------------------------------
# Crawlers/social scrapers hit these and get real <title>/meta/OG/JSON-LD +
# a visible #ssr-body from the backend; humans boot the same Vite SPA shell.
    # The HTML references /assets, *.js etc. which fall through to
    # the static locations below (not proxied).
    location = /                 { proxy_pass http://algorand_api; }
    location = /news             { proxy_pass http://algorand_api; }
    location ^~ /news/articles/  { proxy_pass http://algorand_api; }
    # Locale-prefixed article documents (/fr/news/articles/slug), the URL form
    # translations moved to on 2026-07-29. A regex, because the prefix is one
    # of a fixed set — nine near-identical `^~` blocks would say the same thing
    # at nine times the length; regex locations are still evaluated before the
    # `location /` fallback, so this wins. Keep the language set in sync with
    # ARTICLE_TRANSLATION_LANGS (backend/app/core/article_translation_langs.py):
    # a language added there but not here falls through to `try_files $uri
    # =404` and is served as the SPA shell WITH A 404 STATUS — no SSR, no
    # translated <title>, and a 404 to every crawler.
    location ~ ^/(ar|es|fa|fr|hi|ps|ru|zh)/news/articles/ { proxy_pass http://algorand_api; }
    location ^~ /og/article/     { proxy_pass http://algorand_api; }
    location ^~ /section/        { proxy_pass http://algorand_api; }
    location = /topics           { proxy_pass http://algorand_api; }
    location ^~ /topic/          { proxy_pass http://algorand_api; }
    location = /glossary         { proxy_pass http://algorand_api; }
    location ^~ /glossary/       { proxy_pass http://algorand_api; }
    location = /hot              { proxy_pass http://algorand_api; }
    location = /top              { proxy_pass http://algorand_api; }
    location = /about            { proxy_pass http://algorand_api; }
    location = /contact          { proxy_pass http://algorand_api; }
    location = /search           { proxy_pass http://algorand_api; }
    location = /suggestions      { proxy_pass http://algorand_api; }
    location = /admin            { proxy_pass http://algorand_api; }
    location = /robots.txt       { proxy_pass http://algorand_api; }
    location = /sitemap.xml      { proxy_pass http://algorand_api; }
    location = /sitemap-news.xml { proxy_pass http://algorand_api; }
    location ~ ^/sitemap-(pages|articles-[0-9]+)\.xml$ { proxy_pass http://algorand_api; }
    location = /feed.xml         { proxy_pass http://algorand_api; }
    location ^~ /feed/topic/      { proxy_pass http://algorand_api; }
    location = /llms.txt         { proxy_pass http://algorand_api; }

    # Same-origin API (image proxy, JSON) — avoids a second TLS/DNS hop for LCP
    # images and keeps /api/v1/img cacheable under the site host.
    location ^~ /api/ {
        proxy_pass http://algorand_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Serve the .br/.gz siblings emitted by deploy.sh instead of compressing
    # the multi-MB WASM/JS per request. brotli_static needs the ngx_brotli
    # module (libnginx-mod-http-brotli; installed by deploy.sh provision).
    gzip_static on;
    brotli_static on;

    # Self-hosted Vite fonts under /fonts/*.woff2 (stable content-addressed names).
    location ^~ /fonts/ {
        try_files $uri =404;
        # Real 404 — never soft-404 into index.html (MIME poison).
        error_page 404 = @static_404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Vite hashed build output (/assets/index-XXXX.js, *.css) — immutable forever.
    location ^~ /assets/ {
        try_files $uri =404;
        # Missing chunks must NOT become index.html or dynamic import() dies with
        # "disallowed MIME type (text/html)" after a deploy rotates hashes.
        error_page 404 = @static_404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Writer-captured screenshots (capture_screenshot tool, workers/app/modules
    # /scraper/core/browser_scrape.py) -- served from the SHARED directory, not
    # a release dir, since these must survive every deploy rotation. Filenames
    # are content-addressed (sha256 of the PNG bytes), so immutable caching is
    # safe the same way it is for the hashed Vite build output above.
    location ^~ /media/screenshots/ {
        alias @TARGET_PATH@/shared/media/screenshots/;
        try_files $uri =404;
        error_page 404 = @static_404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location @static_404 {
        internal;
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404 "Not found\n";
    }

    # Conventional bare paths some browsers/OSes/crawlers request directly
    # regardless of what <head> says (Safari's "Add to Home Screen", legacy
    # favicon auto-probing, some link-unfurlers) — alias to the real assets
    # so they don't 404 even though the <link> tags already point elsewhere.
    location = /favicon.ico {
        try_files /favicon.png =404;
        default_type image/png;
    }
    location = /apple-touch-icon.png {
        try_files /icons/icon-192.png =404;
        default_type image/png;
    }
    location = /apple-touch-icon-precomposed.png {
        try_files /icons/icon-192.png =404;
        default_type image/png;
    }

    # Entrypoints / service worker / manifest are NOT content-hashed — always
    # revalidate so browsers pick up new releases. (Vite hashed /assets/* and
    # /fonts/* are immutable above.)
    location ~* ^/(index\.html|sw\.js|workbox-[a-z0-9]+\.js|registerSW\.js|manifest\.webmanifest|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        # Re-advertise HTTP/3 here: nginx drops inherited add_headers in any
        # location that sets its own, and `/` serves index.html through THIS
        # location (try_files), so the document would otherwise never carry it.
        # Same reasoning applies to the security headers below.
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://perawallet.s3-eu-west-3.amazonaws.com https://s3.amazonaws.com; connect-src 'self' https://algorand-api.pxke.me https://wallet-connect-a.perawallet.app wss://wallet-connect-a.perawallet.app https://bridge.walletconnect.org wss://bridge.walletconnect.org https://wc.perawallet.app wss://wc.perawallet.app https://mainnet-api.algonode.cloud https://indexer-mainnet.chain.perawallet.app https://node-mainnet.chain.perawallet.app; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Source maps are optional; a soft-404 (index.html) makes the browser try to
    # parse HTML as JSON — keep real 404s for *.map.
    location ~* \.map$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Draft-share links (/shared/:token) — a private, token-gated view, never
    # meant to be crawled/indexed, so unlike the SSR document routes above
    # this does NOT proxy to the backend (which has no matching route for it
    # — the token check happens entirely client-side against the JSON API).
    # Served as a genuine 200 (not through the catch-all's error_page 404
    # below), since a bare 404 status on the SPA shell breaks link-preview
    # unfurlers (Slack/Discord/iMessage) even though a human's browser
    # renders the body fine either way — the client router picks up the
    # real path and boots SharedArticle.svelte once index.html loads.
    location ^~ /shared/ {
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Same header-duplication requirement as the index.html location
        # below — nginx drops all inherited add_headers in any location
        # that sets its own.
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://perawallet.s3-eu-west-3.amazonaws.com https://s3.amazonaws.com; connect-src 'self' https://algorand-api.pxke.me https://wallet-connect-a.perawallet.app wss://wallet-connect-a.perawallet.app https://bridge.walletconnect.org wss://bridge.walletconnect.org https://wc.perawallet.app wss://wc.perawallet.app https://mainnet-api.algonode.cloud https://indexer-mainnet.chain.perawallet.app https://node-mainnet.chain.perawallet.app; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Unknown paths return a real 404 (with the SPA shell so the app can render
    # its not-found UI) instead of a 200 soft-404. Known document routes are
    # proxied above; real asset files are served by try_files. Backend-proxied
    # 404s pass through untouched (proxy_intercept_errors is off by default).
    error_page 404 /index.html;
    location / {
        try_files $uri =404;
    }
}

# --- API -----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen 443 quic;   # HTTP/3 — stripped at install if nginx lacks QUIC
    http2 on;
    http3 on;
    server_name @API_DOMAIN@;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/@SITE_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@SITE_DOMAIN@/privkey.pem;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # No CSP/X-Frame-Options/Permissions-Policy here -- this host never
    # serves user-facing HTML (see the tightening note below), so those
    # would be dead weight. HSTS and nosniff still apply to any HTTPS host.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Compress JSON API responses (article bodies, lists) — static assets are
    # already precompressed, but proxied responses are generated per request.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    # Only /api/ and /health/ are what this domain is FOR (VITE_API_BASE_URL
    # and Flutter's API_BASE_URL both point here; deploy.sh's own readiness
    # probe hits the backend directly on 127.0.0.1, not through this vhost,
    # but a public /health/ is kept in case anything external monitors it).
    #
    # This used to be a bare `location / { proxy_pass ...; }` -- since the
    # backend is one Robyn app registering BOTH the JSON API and the
    # SSR document routes (home, news, article, sitemap...) with no
    # Host-based discrimination, that proxied EVERYTHING, and this "api"
    # subdomain quietly served the full newspaper homepage HTML. Not a
    # redirect (confirmed 2026-07-30: no 3xx, no Location header) -- just an
    # unintended second copy of the whole site, unusable as one (no /assets/
    # location here, so the SPA shell never boots) but needless surface all
    # the same. Canonical URLs are absolute and fixed to @SITE_DOMAIN@
    # regardless of which host served the request, so this was very unlikely
    # to have caused real duplicate-content indexing -- tightening it now
    # while there is still ~nothing indexed under this domain to clean up.
    location ^~ /api/ {
        proxy_pass http://algorand_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health/ready {
        proxy_pass http://algorand_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    location / {
        return 404;
    }
}

# --- blog.pxke.me (retired) ----------------------------------------------------
# The old static blog is gone. Serve explicit 410s so search engines deindex its
# URLs: the host-level ssl_reject_handshake catch-all reads to crawlers as
# "temporarily unreachable" and leaves stale results up for months, while 410
# Gone drops them fast (same signal our deleted articles use). Cert lineage
# blog.pxke.me-0001 pre-dates this file and is renewed by certbot's nginx
# authenticator, which injects its challenge into the :80 block below.
server {
    listen 80;
    server_name blog.pxke.me;
    location / { return 410; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name blog.pxke.me;

    ssl_certificate /etc/letsencrypt/live/blog.pxke.me-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.pxke.me-0001/privkey.pem;

    location / { return 410; }
}

# --- pxke.me (retired, bare domain) ---------------------------------------------
# Same reasoning as blog.pxke.me above: the bare domain used to serve indexed
# content and is now gone, so it gets explicit 410s instead of falling into
# the host-level ssl_reject_handshake catch-all. Cert lineage is 'pxke.me'.
server {
    listen 80;
    server_name pxke.me;
    location / { return 410; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pxke.me;

    ssl_certificate /etc/letsencrypt/live/pxke.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pxke.me/privkey.pem;

    location / { return 410; }
}
