name: Release candidate

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Test gate
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          cd backend && PYTHONPATH=. pytest tests/ -q
      - name: Package
        run: |
          ARCHIVE=$(PACKAGE_OUTPUT=archive ./deploy/package.sh)
          test -f "$ARCHIVE"
          test -f "${ARCHIVE}.sha256"
          cat "${ARCHIVE}.sha256"
      - name: Summary
        run: echo "Release candidate tarball built; deploy to TestNet per release-cadence.md"
