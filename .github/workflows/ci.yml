name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Ruff check
        run: pip install ruff && ruff check backend workers deploy/scripts
      - name: Ruff format
        run: ruff format --check backend workers deploy/scripts
      - name: Vulture
        run: pip install vulture && vulture
      - name: Shellcheck deploy scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy/deploy.sh deploy/package.sh deploy/rollback.sh deploy/scripts/*.sh

  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip install --no-deps -e "./backend[dev]"
      - name: Pytest with coverage
        working-directory: backend
        run: |
          pip install pytest-cov
          PYTHONPATH=. pytest tests/ -q --cov=app --cov-report=term-missing

  workers:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workers deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip install --no-deps -e "./workers[dev]"
      - name: Workers pytest
        working-directory: workers
        run: PYTHONPATH=. pytest tests/ -q
      - name: Import smoke
        working-directory: workers
        run: PYTHONPATH=. python -c "from app.celery_app import celery_app; print(celery_app.main)"

  conduit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go test
        working-directory: conduit
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: npm ci && npm run build

  docker-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Canonical docker test (Python 3.14 image)
        env:
          PLATFORM_TAG: ci-${{ github.sha }}
          PLATFORM_DEV: "1"
        run: ./docker/bin/compose-test.sh
      - name: Prune CI images
        if: always()
        run: docker image prune -af
