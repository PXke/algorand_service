<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A printed stamp, not an app icon: hard corners, ink ground, and the
       accent kept to a single rule along the foot — the same device the
       nameplate uses. The old mark was a blue squircle with decorative
       bar-chart bars, which read as a product tile rather than a masthead. -->
