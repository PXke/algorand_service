  <path
    fill="#fffdf8"
    fill-rule="evenodd"
    d="M8 4.6h7.85c4.7 0 7.75 2.65 7.75 6.55s-3.05 6.5-7.75 6.5H12.35V25H8V4.6Zm4.35 3.65v5.75h3.35c2.2 0 3.5-1.1 3.5-2.9s-1.3-2.85-3.5-2.85h-3.35Z"
  />
  <rect id="rule" y="28" width="32" height="4" fill="#4a5bd0"/>
</svg>
