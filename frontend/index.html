<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Independent coverage of the Algorand ecosystem — curated news, topics, and search."
    />
    <meta name="theme-color" content="#3a49ad" />
    <title>PXke Algorand</title>
    <!--
      Three voices, and the voice says who is speaking:
        Archivo             - headlines. A sober editorial grotesque; the
                              earlier Bricolage read playful, which is wrong
                              for a masthead.
        IBM Plex Mono       - anything the pipeline stamps: block height,
                              timestamps, kickers, counts. The machine's voice.
        Source Serif 4      - article prose only. The reading voice.
      The serif is no longer prose-only: story decks use it. It is deliberately
      NOT preloaded, though. At 119KB it was 54% of the preload budget, and
      `optional` gives a face ~100ms before falling back for good — on
      throttled mobile it cannot arrive in that window, so preloading it spent
      over half the critical-path font bytes on a face the first paint would
      not use, delaying FCP/LCP. It still loads normally and is used from cache
      on the next view and on article pages, where the prose actually wants it.
      Mono is preloaded at 600, the weight the front page actually sets
      (kickers, rules, figures); 400 appears only in article code blocks.
      The italic stays unpreloaded — it is fetched only if an <em> renders.
    -->
    <link rel="preload" href="/fonts/Archivo-400-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/PlexMono-600.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 400 800;
        font-stretch: 62% 125%;
        font-display: optional;
        src: url('/fonts/Archivo-400-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: optional;
        src: url('/fonts/PlexMono-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 600 700;
        font-display: optional;
        src: url('/fonts/PlexMono-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Serif 4';
        font-style: normal;
        font-weight: 400 700;
        font-display: optional;
        src: url('/fonts/SourceSerif4-400-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Serif 4';
        font-style: italic;
        font-weight: 400 700;
        font-display: optional;
        src: url('/fonts/SourceSerif4-400-700-italic.woff2') format('woff2');
      }
      /*
        Boot with SSR: #ssr-body is a fixed visual overlay (no layout).
        #app stays in normal flow but visibility:hidden so mount/layout
        shifts do not count toward CLS. Reveal = drop overlay + show #app.
      */
      html.spa-booting #ssr-body {
        position: fixed !important;
        inset: 0;
        z-index: 20;
        overflow: auto;
        max-width: none !important;
        margin: 0 !important;
      }
      html.spa-booting #app {
        visibility: hidden;
        min-height: 100vh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // WalletConnect / crypto bundles expect Node's `global`.
      globalThis.global ??= globalThis
      if (document.getElementById('ssr-body')) {
        document.documentElement.classList.add('spa-booting')
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
