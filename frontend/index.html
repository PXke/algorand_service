<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Independent coverage of the Algorand ecosystem — curated news, topics, and search."
    />
    <meta name="theme-color" content="#4F46E5" />
    <title>PXke Algorand</title>
    <!-- Self-hosted fonts (subset woff2). Weights 600/800 map to 700. -->
    <link
      rel="preload"
      href="/fonts/Inter-w400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Inter-w700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/Inter-w400.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 600 800;
        font-display: swap;
        src: url('/fonts/Inter-w700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Serif 4';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/SourceSerif4-w700.woff2') format('woff2');
      }
      /*
        Boot with SSR: #ssr-body is a fixed visual overlay (no layout).
        #app stays in normal flow but visibility:hidden so mount/layout
        shifts do not count toward CLS. Reveal = drop overlay + show #app.
      */
      html.spa-booting #ssr-body {
        position: fixed !important;
        inset: 0;
        z-index: 20;
        overflow: auto;
        max-width: none !important;
        margin: 0 !important;
      }
      html.spa-booting #app {
        visibility: hidden;
        min-height: 100vh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // WalletConnect / crypto bundles expect Node's `global`.
      globalThis.global ??= globalThis
      if (document.getElementById('ssr-body')) {
        document.documentElement.classList.add('spa-booting')
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
