name: algorand_auth_core
description: >-
  Minimal Algorand primitives for wallet-auth (address decode, algod params,
  unsigned payment tx encoding). Extracted from the wallet-auth use of
  algorand_dart 1.0.3 — no dio dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.2.0

dependencies:
  base32: ^2.1.3
  collection: ^1.19.0
  crypto: ^3.0.0
  http: ^1.2.0
  msgpack_dart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  algorand_dart: ^1.0.3
