# clamd.conf for the x402-scan clamd SIDECAR only -- never used by the
# per-request scan container (that one runs scan.py -> checks/clamav.py's
# `clamdscan` CLIENT, which reads this same file via --config-file so both
# sides agree on the socket path, but a client never needs the server-only
# directives below to actually be true of its own container).
#
# Written from scratch, not derived from Alpine's shipped
# /etc/clamav/clamd.conf.sample -- so there is no leftover bare "Example"
# placeholder line to comment out (ClamAV's standard clamd-won't-start
# gotcha). If this file is ever regenerated from that sample instead, that
# line is the first thing to strip.

# Required so clamd stays the container's PID 1 in the foreground. Without
# this, clamd daemonizes (forks to background and the parent exits), which
# would make `docker run -d` see the entrypoint exit immediately and stop
# the container right after starting it -- the opposite of "long-lived".
Foreground yes

# No `User` directive: start_clamd_sidecar.sh runs this container as
# --user 10001:10001 (the same "scanner" uid the per-request containers run
# as, see ../Dockerfile) from the start, so clamd never needs root and never
# needs to drop privileges mid-run. Simpler and avoids any ordering question
# of "does the socket get created before or after the privilege drop".

# Local Unix domain socket only. TCPSocket is left unset (disabled) -- this
# is the whole point: the socket travels over a bind-mounted shared
# directory, not the network, so both this sidecar and every per-request
# scan container can keep --network none (see ../services/sandbox_runner.py
# and checks/clamav.py's CLAMD_SOCKET_DIR).
LocalSocket /run/clamav/clamd.sock
FixStaleSocket yes

# Belt-and-suspenders: explicit world rw on the socket file itself. Since
# both this sidecar and every per-request container already run as the same
# uid (10001), ownership alone would likely be enough, but this removes any
# dependency on that coincidence continuing to hold, and there is no
# additional exposure from it -- the socket only exists inside a directory
# bind-mounted solely into these containers, never published on the host
# network or a TCP port.
LocalSocketMode 666

# LogFile/PidFile must live somewhere uid 10001 can write. The image's
# stock /var/log/clamav and /var/lib/clamav are owned by root/clamav (uid
# 100) and not writable by "scanner" -- but /run/clamav (this same shared,
# bind-mounted directory) already has to be writable by that uid for the
# socket itself, so reuse it.
LogFile /run/clamav/clamd.log
LogTime yes
PidFile /run/clamav/clamd.pid

# Signature DB is baked into the image at build time (see ../Dockerfile's
# freshclam RUN step) at the default /var/lib/clamav, world-readable
# (apk's clamav package ships it drwxr-xr-x / -rw-r--r--) -- no
# DatabaseDirectory override needed, and this sidecar's --network none
# means it could never freshclam itself even if it wanted to.

# Follow-up security audit finding: this was 100M while
# x402_scan_max_download_bytes (backend/app/core/config.py) is 1GB -- a
# 100MB-1GB target silently exceeded ClamAV's own cap, and clamav.py's
# result-parsing (only "clean" vs a line ending "FOUND") had no way to tell
# "actually scanned, clean" apart from "skipped for being oversized, clean
# by default" -- exactly the "empty is not none found" trap, on the paid
# verdict. Raised to match the real download cap; checks/clamav.py also
# independently detects ClamAV's own size-limit-skip message now, so this
# stays correct even if the two configs ever drift again.
StreamMaxLength 1024M
MaxFileSize 1024M
MaxScanSize 1024M

# This sidecar sees light, bursty, single-file-at-a-time traffic (one
# request = one clamdscan --stream call) -- not tuned for high concurrency.
MaxThreads 4
MaxConnectionQueueLength 32
ReadTimeout 120
