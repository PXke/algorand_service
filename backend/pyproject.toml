[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorand-platform-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "celery>=5.3",
  "falcon>=3.1.3",
  "gunicorn>=22.0.0",
  "msgspec>=0.18",
  "redis>=5.0.0",
  "bugsnag>=4.6.0",
  "cassandra-driver>=3.29.0",
  "typesense>=0.21.0",
  "py-algorand-sdk>=2.5.0",
  "pynacl>=1.5.0",
  # x402 paid-endpoint protocol (Algorand Global x402 Challenge) — sync classes
  # only, no Flask/FastAPI extra needed (we adapt framework requests ourselves, see
  # app/modules/x402/adapter.py). [extensions] pulls in jsonschema, needed for
  # the Bazaar discovery extension (x402.extensions.bazaar) required by the
  # contest submission checklist.
  "x402-avm[extensions]>=2.0.2",
  "geoip2>=4.8.0",
  # /api/v1/img: SVG→PNG rasterization (CanvasKit can't decode SVG client-side)
  "resvg-py>=0.3.3",
  # ICO re-encoding (media proxy) + generated OG share cards (seo/share_card.py)
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  "ruff>=0.8.0",
  "vulture>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default (pytest-xdist). Override with `-n0` for a serial run.
addopts = ["-n", "auto"]
# "../shared" mirrors what deploy/scripts/link_shared.sh does in the prod venv
# (a .pth pointing at releases/current/shared). Declaring it here instead of
# relying on that link means tests resolve algorand_shared from repo state, so
# they keep passing after a venv rebuild wipes the .pth.
pythonpath = [".", "../shared"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
# Fonts backing seo/share_card.py's generated OG images — binary assets, not
# picked up by the default .py-only package discovery above.
"app.modules.seo" = ["assets/fonts/*.ttf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "D",
  "C",
  "B",
  "C90",
  "I",
  "UP",
  "ANN",
  "A",
  "C4",
  "DTZ",
  "LOG",
  "T20",
  "PT",
  "RSE",
  "RET",
  "SIM",
  "ARG",
  "PTH",
  "TD",
  "FIX",
  "RUF",
  "PERF",
]
# RUF001/RUF002: en-dash/minus-sign are intentional typography in LLM prompts
# and docstrings, not typos for hyphen-minus.
ignore = ["RUF001", "RUF002"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/test_arc0060_verify.py" = ["E501"]
# One-off operational scripts: stdout IS the interface, so print is correct.
"scripts/*.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
